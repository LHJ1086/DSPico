name: Deploy configurator to GitHub Pages

# Publishes the static web/ configurator to GitHub Pages.
# One-time setup in the repo: Settings -> Pages -> Source: "GitHub Actions".
# Then this runs on every push to main that touches web/, or on demand via the
# "Run workflow" button (which lets you deploy from any branch).

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload web/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
