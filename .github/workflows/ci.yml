name: CI

# Two independent checks:
#   * tests         — host-side unit tests (DSP, signal path, ring, web logic).
#                     Fast, hermetic, and authoritative: these gate every push.
#   * firmware-build — full RP2350 cross-compile against the pinned Pico SDK.
#                     This is the first automated cross-build; per the README the
#                     TinyUSB UAC2 descriptor macros are SDK-version-sensitive, so
#                     a failure here is an actionable "needs a macro fixup" signal
#                     rather than a regression in the tested DSP/path code.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run all test suites
        run: bash tests/run.sh

  firmware-build:
    name: Firmware cross-build (RP2350)
    runs-on: ubuntu-latest
    env:
      PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3 build-essential \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib libusb-1.0-0-dev
      - name: Clone Pico SDK 2.1.1 (with submodules)
        run: |
          git clone -b 2.1.1 --depth 1 --recurse-submodules \
            https://github.com/raspberrypi/pico-sdk.git "${PICO_SDK_PATH}"
      - name: Fetch Pico-PIO-USB
        run: ./setup.sh
      - name: Configure
        run: cmake -B build -G Ninja -DPICO_BOARD=pico2
      - name: Build
        run: cmake --build build -j
      - name: Upload UF2
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dspico-uf2
          path: build/dspico.uf2
          if-no-files-found: warn
