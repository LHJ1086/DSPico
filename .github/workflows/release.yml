name: Release firmware

# Push a version tag (e.g. v0.1.0) to build the RP2350 firmware and publish a
# GitHub Release with dspico.uf2 attached:
#     git tag v0.1.0 && git push origin v0.1.0
# Any v0.x tag is marked as a pre-release (the iso-over-PIO host path is not yet
# hardware-validated — see the README status table).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/version to build and release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build + publish firmware
    runs-on: ubuntu-latest
    env:
      PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
      REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3 build-essential \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib libusb-1.0-0-dev
      - name: Clone Pico SDK 2.1.1 (with submodules)
        run: |
          git clone -b 2.1.1 --depth 1 --recurse-submodules \
            https://github.com/raspberrypi/pico-sdk.git "${PICO_SDK_PATH}"
      - name: Fetch Pico-PIO-USB
        run: ./setup.sh
      - name: Build firmware
        run: |
          cmake -B build -G Ninja -DPICO_BOARD=pico2
          cmake --build build -j
      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp build/dspico.uf2 "dist/dspico-${REF_NAME}.uf2"
          cp build/dspico.elf "dist/dspico-${REF_NAME}.elf"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REF_NAME }}
          name: DSPico ${{ env.REF_NAME }}
          prerelease: ${{ startsWith(env.REF_NAME, 'v0.') }}
          generate_release_notes: true
          body: |
            DSPico firmware for the Waveshare RP2350-USB-CM, built from
            `${{ env.REF_NAME }}` against Pico SDK 2.1.1 (RP2350 / Cortex-M33).

            **Flash:** hold BOOTSEL, tap reset, then drag `dspico-${{ env.REF_NAME }}.uf2`
            onto the `RP2350` USB drive.

            ⚠️ The on-device parametric EQ and PC→EQ→DAC signal path are
            implemented and unit-tested, but the isochronous-audio-over-PIO **host**
            path is not yet validated on hardware (the Phase 1b gate in the README).
            Treat this as an experimental pre-release.
          files: |
            dist/dspico-${{ env.REF_NAME }}.uf2
            dist/dspico-${{ env.REF_NAME }}.elf
